name: Build

on:
  push:
    branches:
      - torutek
  pull_request:
    branches:
      - torutek

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Restore
      run: dotnet restore src/SigSpec.sln
    - name: Build
      run: dotnet build --no-restore -c Release src/SigSpec.sln
    - name: Test
      run: dotnet test --no-restore -c Release src/SigSpec.sln
    - name: Pack
      run: dotnet pack --no-restore -c Release -o ./artifacts src/SigSpec.sln
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      if: github.ref == 'refs/heads/torutek'
